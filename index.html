<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pussyending</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #0b0b0f;
      color: white;
      min-height: 100vh;
    }

    button,
    input,
    textarea {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    header {
      position: sticky;
      top: 0;
      z-index: 50;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      padding: 18px 6%;
      background: rgba(11, 11, 15, 0.92);
      backdrop-filter: blur(18px);
      border-bottom: 1px solid #25252d;
    }

    .logo {
      font-size: 27px;
      font-weight: 900;
      letter-spacing: -1px;
    }

    .logo span {
      color: #ff2c85;
    }

    .header-profile {
      display: none;
      align-items: center;
      gap: 10px;
    }

    .header-profile img {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      object-fit: cover;
      background: #292932;
    }

    .main {
      width: min(1100px, 92%);
      margin: 35px auto;
    }

    .account-screen {
      min-height: 80vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .account-card {
      width: min(500px, 100%);
      padding: 35px;
      border-radius: 25px;
      background: #15151b;
      border: 1px solid #292932;
      box-shadow: 0 20px 80px rgba(0, 0, 0, .45);
    }

    .account-card h1 {
      font-size: 34px;
      margin-bottom: 10px;
    }

    .account-card p {
      color: #a6a6b3;
      line-height: 1.5;
      margin-bottom: 25px;
    }

    label {
      display: block;
      margin: 15px 0 7px;
      font-weight: bold;
    }

    input,
    textarea {
      width: 100%;
      padding: 14px 15px;
      border: 1px solid #33333d;
      border-radius: 13px;
      background: #0e0e13;
      color: white;
      outline: none;
    }

    input:focus,
    textarea:focus {
      border-color: #ff2c85;
    }

    textarea {
      min-height: 100px;
      resize: vertical;
    }

    .profile-preview {
      width: 90px;
      height: 90px;
      margin: 10px 0;
      border-radius: 50%;
      object-fit: cover;
      background: #26262e;
      border: 3px solid #ff2c85;
      display: none;
    }

    .primary-btn {
      width: 100%;
      border: 0;
      margin-top: 22px;
      padding: 15px 20px;
      border-radius: 14px;
      font-weight: 800;
      color: white;
      background: linear-gradient(135deg, #ff2c85, #8e37ff);
      transition: .2s;
    }

    .primary-btn:hover {
      transform: translateY(-2px);
      filter: brightness(1.08);
    }

    #siteContent {
      display: none;
    }

    .profile-banner {
      display: flex;
      align-items: center;
      gap: 18px;
      padding: 25px;
      margin-bottom: 25px;
      border-radius: 22px;
      border: 1px solid #292932;
      background:
        radial-gradient(circle at 0% 0%, rgba(255, 44, 133, .22), transparent 35%),
        #15151b;
    }

    .profile-banner img {
      width: 85px;
      height: 85px;
      border-radius: 50%;
      object-fit: cover;
      border: 3px solid #ff2c85;
    }

    .profile-banner h2 {
      font-size: 25px;
      margin-bottom: 5px;
    }

    .profile-banner p {
      color: #aaaab4;
      line-height: 1.45;
      white-space: pre-wrap;
    }

    .upload-box {
      padding: 25px;
      border-radius: 22px;
      background: #15151b;
      border: 1px solid #292932;
      margin-bottom: 30px;
    }

    .upload-box h2 {
      margin-bottom: 8px;
    }

    .upload-box .small {
      color: #9696a2;
      margin-bottom: 12px;
    }

    .videos-title {
      margin-bottom: 18px;
      font-size: 27px;
    }

    .video-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 22px;
    }

    .video-card {
      overflow: hidden;
      border-radius: 20px;
      background: #15151b;
      border: 1px solid #292932;
    }

    .video-card video {
      width: 100%;
      display: block;
      aspect-ratio: 16 / 9;
      object-fit: contain;
      background: black;
    }

    .video-info {
      padding: 17px;
    }

    .video-info h3 {
      margin-bottom: 14px;
      font-size: 19px;
      word-break: break-word;
    }

    .creator-row {
      display: flex;
      align-items: center;
      gap: 11px;
      flex-wrap: wrap;
    }

    .creator-row img {
      width: 39px;
      height: 39px;
      border-radius: 50%;
      object-fit: cover;
    }

    .creator-name {
      flex: 1;
      min-width: 100px;
      font-weight: bold;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .subscribe-btn {
      min-width: 122px;
      border: 0;
      border-radius: 999px;
      padding: 11px 16px;
      color: white;
      background: #ff2c85;
      font-weight: 800;
      transition: .2s;
    }

    .subscribe-btn:hover {
      background: #8e37ff;
      transform: scale(1.03);
    }

    .delete-btn {
      border: 0;
      border-radius: 999px;
      padding: 11px 16px;
      color: white;
      background: #c92f2f;
      font-weight: 800;
      transition: .2s;
    }

    .delete-btn:hover {
      background: #ef3d3d;
      transform: scale(1.03);
    }

    .empty {
      padding: 35px;
      color: #9b9ba7;
      text-align: center;
      border: 1px dashed #373741;
      border-radius: 18px;
      grid-column: 1 / -1;
    }

    .logout-btn {
      border: 1px solid #383842;
      padding: 10px 15px;
      border-radius: 12px;
      color: white;
      background: #1a1a20;
    }

    .logout-btn:hover {
      background: #26262f;
    }

    .status {
      margin-top: 12px;
      color: #ff7bb3;
      min-height: 20px;
    }

    @media (max-width: 650px) {
      header {
        padding: 15px 4%;
      }

      .main {
        width: 94%;
      }

      .account-card {
        padding: 24px;
      }

      .profile-banner {
        align-items: flex-start;
      }

      .profile-banner img {
        width: 65px;
        height: 65px;
      }
    }
  </style>
</head>

<body>

<header>
  <div class="logo">
    Pussy<span>ending</span>
  </div>

  <div class="header-profile" id="headerProfile">
    <img id="headerAvatar" alt="Photo de profil">
    <strong id="headerUsername"></strong>

    <button
      class="logout-btn"
      onclick="logout()"
    >
      Déconnexion
    </button>
  </div>
</header>

<main class="main">

  <!-- Création de compte obligatoire -->
  <section
    class="account-screen"
    id="accountScreen"
  >

    <div class="account-card">

      <h1>Crée ton compte</h1>

      <p>
        Tu dois créer un profil avant de pouvoir
        accéder aux vidéos.
      </p>

      <form id="accountForm">

        <label for="username">
          Nom du compte
        </label>

        <input
          type="text"
          id="username"
          placeholder="Ton pseudo"
          maxlength="30"
          required
        >

        <label for="avatarInput">
          Photo de profil
        </label>

        <input
          type="file"
          id="avatarInput"
          accept="image/*"
          required
        >

        <img
          class="profile-preview"
          id="profilePreview"
          alt="Aperçu"
        >

        <label for="bio">
          Bio
        </label>

        <textarea
          id="bio"
          maxlength="180"
          placeholder="Écris quelques mots sur toi..."
          required
        ></textarea>

        <button
          type="submit"
          class="primary-btn"
        >
          Créer mon compte
        </button>

        <div
          class="status"
          id="accountStatus"
        ></div>

      </form>

    </div>

  </section>


  <!-- Site accessible après création du compte -->
  <section id="siteContent">

    <div class="profile-banner">

      <img
        id="profileAvatar"
        alt="Photo de profil"
      >

      <div>
        <h2 id="profileName"></h2>
        <p id="profileBio"></p>
      </div>

    </div>


    <div class="upload-box">

      <h2>
        Uploader une vidéo
      </h2>

      <p class="small">
        Ajoute un titre puis sélectionne ta vidéo.
      </p>

      <form id="videoForm">

        <label for="videoTitle">
          Titre
        </label>

        <input
          id="videoTitle"
          type="text"
          maxlength="80"
          placeholder="Titre de la vidéo"
          required
        >

        <label for="videoFile">
          Vidéo
        </label>

        <input
          id="videoFile"
          type="file"
          accept="video/*"
          required
        >

        <button
          class="primary-btn"
          type="submit"
        >
          Publier la vidéo
        </button>

        <div
          class="status"
          id="uploadStatus"
        ></div>

      </form>

    </div>


    <h2 class="videos-title">
      Vidéos
    </h2>

    <div
      class="video-grid"
      id="videoGrid"
    ></div>

  </section>

</main>


<script>

  let currentProfile = null;
  let database = null;


  const accountScreen =
    document.getElementById("accountScreen");

  const siteContent =
    document.getElementById("siteContent");

  const accountForm =
    document.getElementById("accountForm");

  const videoForm =
    document.getElementById("videoForm");

  const avatarInput =
    document.getElementById("avatarInput");

  const profilePreview =
    document.getElementById("profilePreview");


  /*
    ===================================
    BASE DE DONNÉES INDEXEDDB
    ===================================
  */

  function openDatabase() {

    return new Promise((resolve, reject) => {

      const request =
        indexedDB.open("pussyendingDB", 1);


      request.onupgradeneeded = function(event) {

        const db =
          event.target.result;

        if (
          !db.objectStoreNames.contains("videos")
        ) {

          db.createObjectStore(
            "videos",
            {
              keyPath: "id",
              autoIncrement: true
            }
          );

        }

      };


      request.onsuccess = function(event) {

        database =
          event.target.result;

        resolve(database);

      };


      request.onerror = function() {

        reject(
          "Erreur avec la base de données"
        );

      };

    });

  }


  /*
    ===================================
    APERÇU PHOTO DE PROFIL
    ===================================
  */

  avatarInput.addEventListener(
    "change",
    function() {

      const file =
        this.files[0];

      if (!file) {
        return;
      }


      const reader =
        new FileReader();


      reader.onload = function(event) {

        profilePreview.src =
          event.target.result;

        profilePreview.style.display =
          "block";

      };


      reader.readAsDataURL(file);

    }
  );


  /*
    ===================================
    CRÉATION DU COMPTE
    ===================================
  */

  accountForm.addEventListener(
    "submit",
    function(event) {

      event.preventDefault();


      const username =
        document
          .getElementById("username")
          .value
          .trim();


      const bio =
        document
          .getElementById("bio")
          .value
          .trim();


      const avatar =
        avatarInput.files[0];


      if (
        !username ||
        !bio ||
        !avatar
      ) {

        document
          .getElementById("accountStatus")
          .textContent =
          "Remplis tous les champs.";

        return;

      }


      const reader =
        new FileReader();


      reader.onload = function(event) {

        const profile = {

          username: username,

          bio: bio,

          avatar: event.target.result

        };


        localStorage.setItem(
          "pussyendingProfile",
          JSON.stringify(profile)
        );


        currentProfile =
          profile;


        showSite();

      };


      reader.readAsDataURL(avatar);

    }
  );


  /*
    ===================================
    AFFICHAGE DU SITE
    ===================================
  */

  function showSite() {

    if (!currentProfile) {
      return;
    }


    accountScreen.style.display =
      "none";

    siteContent.style.display =
      "block";


    document
      .getElementById("headerProfile")
      .style.display =
      "flex";


    document
      .getElementById("profileAvatar")
      .src =
      currentProfile.avatar;


    document
      .getElementById("profileName")
      .textContent =
      currentProfile.username;


    document
      .getElementById("profileBio")
      .textContent =
      currentProfile.bio;


    document
      .getElementById("headerAvatar")
      .src =
      currentProfile.avatar;


    document
      .getElementById("headerUsername")
      .textContent =
      currentProfile.username;


    loadVideos();

  }


  /*
    ===================================
    AJOUTER UNE VIDÉO
    ===================================
  */

  videoForm.addEventListener(
    "submit",
    function(event) {

      event.preventDefault();


      const title =
        document
          .getElementById("videoTitle")
          .value
          .trim();


      const videoFile =
        document
          .getElementById("videoFile")
          .files[0];


      if (
        !title ||
        !videoFile
      ) {

        document
          .getElementById("uploadStatus")
          .textContent =
          "Ajoute un titre et une vidéo.";

        return;

      }


      const video = {

        title: title,

        file: videoFile,

        creator:
          currentProfile.username,

        avatar:
          currentProfile.avatar,

        createdAt:
          Date.now()

      };


      const transaction =
        database.transaction(
          ["videos"],
          "readwrite"
        );


      const store =
        transaction.objectStore(
          "videos"
        );


      store.add(video);


      transaction.oncomplete =
        function() {

          document
            .getElementById("uploadStatus")
            .textContent =
            "Vidéo publiée !";


          videoForm.reset();


          loadVideos();

        };


      transaction.onerror =
        function() {

          document
            .getElementById("uploadStatus")
            .textContent =
            "Erreur pendant l'upload.";

        };

    }
  );


  /*
    ===================================
    CHARGER LES VIDÉOS
    ===================================
  */

  function loadVideos() {

    const grid =
      document.getElementById("videoGrid");


    grid.innerHTML = "";


    const transaction =
      database.transaction(
        ["videos"],
        "readonly"
      );


    const store =
      transaction.objectStore(
        "videos"
      );


    const request =
      store.getAll();


    request.onsuccess = function() {

      const videos =
        request.result.sort(
          function(a, b) {
            return (
              b.createdAt -
              a.createdAt
            );
          }
        );


      if (
        videos.length === 0
      ) {

        grid.innerHTML = `
          <div class="empty">
            Aucune vidéo pour le moment.
            <br>
            Publie la première vidéo.
          </div>
        `;

        return;

      }


      videos.forEach(
        function(video) {

          createVideoCard(video);

        }
      );

    };

  }


  /*
    ===================================
    CRÉER UNE CARTE VIDÉO
    ===================================
  */

  function createVideoCard(video) {

    const grid =
      document.getElementById("videoGrid");


    const card =
      document.createElement("article");


    card.className =
      "video-card";


    /*
      Création de l'URL de la vidéo
    */

    const videoURL =
      URL.createObjectURL(
        video.file
      );


    /*
      Lecteur vidéo
    */

    const player =
      document.createElement("video");


    player.src =
      videoURL;


    player.controls =
      true;


    player.preload =
      "metadata";


    /*
      Informations vidéo
    */

    const info =
      document.createElement("div");


    info.className =
      "video-info";


    /*
      Titre
    */

    const title =
      document.createElement("h3");


    title.textContent =
      video.title;


    /*
      Ligne créateur
    */

    const creatorRow =
      document.createElement("div");


    creatorRow.className =
      "creator-row";


    /*
      Photo du créateur
    */

    const avatar =
      document.createElement("img");


    avatar.src =
      video.avatar;


    avatar.alt =
      "Photo du créateur";


    /*
      Nom du créateur
    */

    const creatorName =
      document.createElement("div");


    creatorName.className =
      "creator-name";


    creatorName.textContent =
      video.creator;


    /*
      ===================================
      BOUTON S'ABONNER
      ===================================
    */

    const subscribeButton =
      document.createElement("button");


    subscribeButton.className =
      "subscribe-btn";


    subscribeButton.textContent =
      "S'abonner";


    subscribeButton.dataset.subscribed =
      "false";


    /*
      Quand on passe la souris dessus :
      "480p de vidéo"
    */

    subscribeButton.addEventListener(
      "mouseenter",
      function() {

        this.textContent =
          "480p de vidéo";

      }
    );


    subscribeButton.addEventListener(
      "mouseleave",
      function() {

        if (
          this.dataset.subscribed ===
          "true"
        ) {

          this.textContent =
            "Abonné";

        } else {

          this.textContent =
            "S'abonner";

        }

      }
    );


    /*
      Cliquer pour s'abonner
    */

    subscribeButton.addEventListener(
      "click",
      function() {

        const subscribed =
          this.dataset.subscribed ===
          "true";


        if (subscribed) {

          this.dataset.subscribed =
            "false";

          this.textContent =
            "S'abonner";

        } else {

          this.dataset.subscribed =
            "true";

          this.textContent =
            "Abonné";

        }

      }
    );


    /*
      ===================================
      BOUTON SUPPRIMER
      ===================================
    */

    const deleteButton =
      document.createElement("button");


    deleteButton.className =
      "delete-btn";


    deleteButton.textContent =
      "Supprimer";


    deleteButton.addEventListener(
      "click",
      function() {

        const confirmation =
          confirm(
            "Tu veux vraiment supprimer cette vidéo ?"
          );


        if (!confirmation) {
          return;
        }


        const transaction =
          database.transaction(
            ["videos"],
            "readwrite"
          );


        const store =
          transaction.objectStore(
            "videos"
          );


        store.delete(video.id);


        transaction.oncomplete =
          function() {

            URL.revokeObjectURL(
              videoURL
            );


            loadVideos();

          };


        transaction.onerror =
          function() {

            alert(
              "Impossible de supprimer la vidéo."
            );

          };

      }
    );


    /*
      Ajouter les éléments
    */

    creatorRow.appendChild(
      avatar
    );


    creatorRow.appendChild(
      creatorName
    );


    creatorRow.appendChild(
      subscribeButton
    );


    creatorRow.appendChild(
      deleteButton
    );


    info.appendChild(
      title
    );


    info.appendChild(
      creatorRow
    );


    card.appendChild(
      player
    );


    card.appendChild(
      info
    );


    grid.appendChild(
      card
    );

  }


  /*
    ===================================
    DÉCONNEXION
    ===================================
  */

  function logout() {

    currentProfile =
      null;


    localStorage.removeItem(
      "pussyendingProfile"
    );


    siteContent.style.display =
      "none";


    accountScreen.style.display =
      "flex";


    document
      .getElementById("headerProfile")
      .style.display =
      "none";


    accountForm.reset();


    profilePreview.style.display =
      "none";


    profilePreview.src =
      "";

  }


  /*
    ===================================
    DÉMARRAGE DU SITE
    ===================================
  */

  async function start() {

    try {

      await openDatabase();


      const saved =
        localStorage.getItem(
          "pussyendingProfile"
        );


      if (saved) {

        currentProfile =
          JSON.parse(saved);


        showSite();

      } else {

        accountScreen.style.display =
          "flex";


        siteContent.style.display =
          "none";

      }

    } catch (error) {

      console.error(error);


      alert(
        "Erreur au démarrage du site."
      );

    }

  }


  start();

</script>

</body>
</html>
